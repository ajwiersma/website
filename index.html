<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arend Jan Wiersma</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="description" content="Advies op het gebied van IT en informatiebeveiliging. ">
  <style>
    :root {
      --paper: #f7f4ee;
      --ink: #2b2925;
      --muted: #8a847a;
      --rule: #d9d3c7;
      --error: #9b3b2f;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #1c1b19;
        --ink: #e8e3d9;
        --muted: #8f897e;
        --rule: #3a3833;
        --error: #d98b7f;
      }
    }

    * { box-sizing: border-box; margin: 0; }

    html { font: 1.125rem/1.65 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }

    body {
      background: var(--paper);
      color: var(--ink);
      text-align: center;
    }

    main {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      padding: 2.5rem 1.5rem;
    }

    h1 {
      grid-row: 2;
      font-weight: normal;
      font-size: 2.25rem;
      letter-spacing: .02em;
    }

    #updates {
      grid-row: 3;
      align-self: end;
    }

    h2 { font-weight: normal; font-size: 1rem; font-style: italic; color: var(--muted); }

    form { max-width: 17rem; margin: 1rem auto 0; }

    input, button { font: inherit; color: inherit; background: none; border: 0; padding: 0; }

    input[type="email"] {
      display: block;
      width: 100%;
      padding: .4rem 0;
      text-align: center;
      border-bottom: 1px solid var(--rule);
      border-radius: 0;
      outline: none;
      transition: border-color .2s;
    }
    input[type="email"]::placeholder { color: var(--muted); opacity: .7; }
    input[type="email"]:focus { border-color: var(--ink); }
    input[type="email"][aria-invalid="true"] { border-color: var(--error); }

    button {
      margin-top: .9rem;
      font-style: italic;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: transparent;
      text-underline-offset: .2em;
      transition: text-decoration-color .2s;
    }
    button:hover, button:focus-visible { text-decoration-color: currentColor; outline: none; }
    button:disabled { cursor: default; opacity: .5; }

    .status {
      min-height: 1.65em;
      margin-top: .75rem;
      font-size: .95rem;
      font-style: italic;
      color: var(--muted);
    }
    .status[data-state="error"] { color: var(--error); }
    .status[data-state="success"] { color: var(--ink); }

    .visually-hidden {
      position: absolute; width: 1px; height: 1px;
      overflow: hidden; clip-path: inset(50%); white-space: nowrap;
    }

    .trap { position: absolute; left: -9999px; }
  </style>
</head>
<body>
  <main>
    <h1>Arend Jan Wiersma</h1>

    <section id="updates" aria-labelledby="updates-title" hidden>

      <form id="subscribe" data-plunk-key="pk_f181f871c0b49cedeea4e2b7d7dfc7b72bc5d077f802aabd2a628db5c34c5b95" novalidate>
        <label for="email" class="visually-hidden">E-mailadres</label>
        <input id="email" name="email" type="email" autocomplete="email"
               placeholder="Mijn nieuwsbrief ontvangen?" aria-describedby="status" required>

        <div class="trap" aria-hidden="true">
          <label for="website">Laat dit veld leeg</label>
          <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>

        <button type="submit">Aanmelden</button>
      </form>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script>
    (() => {
      const section = document.getElementById('updates');
      const form = document.getElementById('subscribe');
      const input = form.elements.email;
      const trap = form.elements.website;
      const button = form.querySelector('button');
      const status = document.getElementById('status');

      const endpoint = 'https://next-api.useplunk.com/v1/track';
      const key = form.dataset.plunkKey;
      const source = 'ajwiersma.nl';

      const messages = {
        empty:   'Vul je e-mailadres in.',
        invalid: 'Dat lijkt geen geldig e-mailadres.',
        sending: 'Even geduld…',
        success: 'Dank je wel, je bent aangemeld.',
        busy:    'Te veel pogingen. Probeer het over een paar minuten opnieuw.',
        offline: 'Geen verbinding. Controleer je internet en probeer het opnieuw.',
        failed:  'Er ging iets mis. Probeer het later nog eens.'
      };

      const show = (text, state = '') => {
        status.textContent = text;
        status.dataset.state = state;
      };

      const fail = (text) => {
        input.setAttribute('aria-invalid', 'true');
        show(text, 'error');
        input.focus();
      };

      const succeed = () => {
        form.hidden = true;
        show(messages.success, 'success');
      };

      section.hidden = false;

      input.addEventListener('input', () => {
        input.removeAttribute('aria-invalid');
        if (status.dataset.state === 'error') show('');
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        if (trap.value) return succeed();

        input.value = input.value.trim();
        if (!input.value) return fail(messages.empty);
        if (!input.checkValidity()) return fail(messages.invalid);

        button.disabled = true;
        show(messages.sending);

        try {
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${key}`
            },
            body: JSON.stringify({
              email: input.value,
              event: 'nieuwsbrief-aanmelding',
              subscribed: true,
              data: { source }
            })
          });

          const result = await response.json().catch(() => ({}));

          if (response.ok && result.success) return succeed();

          console.error('Plunk:', response.status, result.error ?? result);

          if (response.status === 422) return fail(messages.invalid);
          if (response.status === 429) return fail(messages.busy);
          fail(messages.failed);
        } catch (error) {
          console.error('Plunk:', error);
          fail(messages.offline);
        } finally {
          button.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
